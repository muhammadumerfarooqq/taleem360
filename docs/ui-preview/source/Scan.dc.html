<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan a diagram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#0A121C;color:#FFFFFF;position:relative;overflow:hidden">
  <!-- camera view: textbook page -->
  <div style="position:absolute;left:44px;top:120px;width:302px;height:520px;background:#F6F3EA;border-radius:6px;transform:rotate(-3deg);box-shadow:0 20px 60px rgba(0,0,0,.6);padding:22px;box-sizing:border-box">
    <div style="height:9px;width:70%;background:#C9C3B3;border-radius:4px"></div>
    <div style="height:7px;width:96%;background:#DAD5C7;border-radius:4px;margin-top:12px"></div>
    <div style="height:7px;width:90%;background:#DAD5C7;border-radius:4px;margin-top:8px"></div>
    <div style="height:7px;width:94%;background:#DAD5C7;border-radius:4px;margin-top:8px"></div>
    <div style="margin-top:20px;display:flex;justify-content:center">
      <svg aria-label="Textbook figure of the human heart" role="img" width="210" height="190" viewBox="0 0 200 200">
        <path d="M100 185 C38 142 18 100 34 68 C50 38 90 44 100 70 C110 44 150 38 166 68 C182 100 162 142 100 185Z" fill="#E9889A" stroke="#7A2433" stroke-width="2"/>
        <path d="M96 66 C94 20 138 12 152 44" fill="none" stroke="#B3283F" stroke-width="13" stroke-linecap="round"/>
        <path d="M118 68 C124 38 150 40 162 58" fill="none" stroke="#4A74D8" stroke-width="10" stroke-linecap="round"/>
        <path d="M66 62 L66 16" fill="none" stroke="#4A74D8" stroke-width="12" stroke-linecap="round"/>
        <path d="M100 74 L100 170" stroke="#7A2433" stroke-width="2" stroke-dasharray="4 4"/>
      </svg>
    </div>
    <div style="font-size:11px;font-weight:700;color:#4B4638;text-align:center;margin-top:6px">Fig 9.4 Human heart</div>
    <div style="height:7px;width:96%;background:#DAD5C7;border-radius:4px;margin-top:18px"></div>
    <div style="height:7px;width:88%;background:#DAD5C7;border-radius:4px;margin-top:8px"></div>
    <div style="height:7px;width:92%;background:#DAD5C7;border-radius:4px;margin-top:8px"></div>
    <div style="height:7px;width:60%;background:#DAD5C7;border-radius:4px;margin-top:8px"></div>
  </div>

  <!-- dim outside the frame -->
  <div style="position:absolute;left:0;top:0;width:390px;height:844px;background:radial-gradient(ellipse 150px 130px at 195px 352px, rgba(10,18,28,0) 60%, rgba(10,18,28,.55) 100%)"></div>

  <!-- framing box -->
  <div style="position:absolute;left:65px;top:225px;width:260px;height:250px">
    <div style="position:absolute;left:0;top:0;width:34px;height:34px;border-left:4px solid #F59E0B;border-top:4px solid #F59E0B;border-radius:10px 0 0 0"></div>
    <div style="position:absolute;right:0;top:0;width:34px;height:34px;border-right:4px solid #F59E0B;border-top:4px solid #F59E0B;border-radius:0 10px 0 0"></div>
    <div style="position:absolute;left:0;bottom:0;width:34px;height:34px;border-left:4px solid #F59E0B;border-bottom:4px solid #F59E0B;border-radius:0 0 0 10px"></div>
    <div style="position:absolute;right:0;bottom:0;width:34px;height:34px;border-right:4px solid #F59E0B;border-bottom:4px solid #F59E0B;border-radius:0 0 10px 0"></div>
  </div>

  <!-- top bar -->
  <div style="position:absolute;left:0;top:0;width:390px;padding:52px 20px 0;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between">
    <a href="Home.dc.html" aria-label="Close scanner" style="width:44px;height:44px;border-radius:22px;background:rgba(14,27,44,.75);display:flex;align-items:center;justify-content:center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div style="height:36px;padding:0 14px;border-radius:18px;background:rgba(14,27,44,.75);display:flex;align-items:center;font-size:13px;font-weight:600">Class 9 · Biology</div>
    <div style="width:44px"></div>
  </div>

  <!-- hint -->
  <div style="position:absolute;left:0;top:500px;width:390px;text-align:center">
    <div style="display:inline-block;padding:10px 16px;border-radius:14px;background:rgba(14,27,44,.8);font-size:14px;font-weight:600">Fit one diagram inside the box</div>
  </div>

  <!-- bottom controls -->
  <div style="position:absolute;left:0;bottom:0;width:390px;height:190px;background:linear-gradient(180deg,rgba(10,18,28,0),#0A121C 45%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:44px;gap:14px;box-sizing:border-box">
    <a href="Fetching.dc.html" aria-label="Capture diagram" style="width:78px;height:78px;border-radius:39px;border:4px solid #FFFFFF;display:flex;align-items:center;justify-content:center">
      <div style="width:58px;height:58px;border-radius:29px;background:#14B8A6"></div>
    </a>
    <div style="font-size:12px;color:#B8C7D9">The camera takes one photo, then closes</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
